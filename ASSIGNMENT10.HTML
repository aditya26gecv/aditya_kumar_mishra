<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOCUMENT</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

<div class="container-fluid mt-4">
    <div class="row">

        <!-- LEFT FORM -->
        <div class="col-sm-6">
            <div class="card shadow bg-warning-subtle">
                <div class="card-header bg-warning text-dark text-center">
                    <h3>Account Recovery</h3>
                </div>

                <div class="card-body">
                    <form>

                        <div class="mb-3">
                            <label class="form-label">Registered Email / Phone</label>
                            <input type="text" class="form-control" placeholder="Enter registered email or phone" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Security Question</label>
                            <select class="form-select">
                                <option>-- Select Question --</option>
                                <option>Your first school?</option>
                                <option>Your favorite teacher?</option>
                                <option>Your birth city?</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Your Answer</label>
                            <input type="text" class="form-control" placeholder="Enter your answer" required>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-warning">Recover Account</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

        <!-- RIGHT FORM -->
        <div class="col-sm-6">
            <div class="card shadow bg-info-subtle">
                <div class="card-header bg-info text-light text-center">
                    <h3>Help & Feedback</h3>
                </div>

                <div class="card-body">
                    <form>

                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control" placeholder="Enter your name">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" placeholder="Enter your email">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Issue Type</label>
                            <select class="form-select">
                                <option>-- Select Issue --</option>
                                <option>Login Problem</option>
                                <option>Password Issue</option>
                                <option>Account Locked</option>
                                <option>Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="3" placeholder="Describe your issue"></textarea>
                        </div>

                        <div class="d-grid">
                            <button class="btn btn-info text-light">Submit Request</button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
